[project]
name = "deckforge"
version = "0.1.0"
description = "Finance deck generator: reference template in, QC'd native .pptx out."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "python-pptx>=1.0.2,<2",
]

[project.scripts]
deckforge = "deckforge.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deckforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["deckforge", "tests"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# python-pptx leaves RGBColor constructors unannotated.
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Default norecursedirs skips any "build" dir, which would hide tests/build.
norecursedirs = [".*", "*.egg", "dist", "node_modules", "venv"]
